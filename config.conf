# LocAI config (edit with: nano ~/.locai/config.conf)
MODEL="$HOME/.locai/models/model.gguf"
THREADS=4          # 4 = fastest on the tested phone, 2 = light mode, avoid 6+
CTX=2048           # context size, lower = less RAM
PORT=8080
HOST=127.0.0.1     # keep as is: only apps on this phone can connect
PARALLEL=1         # parallel chats, 1 = lightest
IDLE_SECONDS=600   # unload the model after this many idle seconds, 0 = never
WAKE_LOCK=1        # 1 = keep Termux alive while running (released on stop)
